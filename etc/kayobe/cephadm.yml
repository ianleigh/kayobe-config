---
###############################################################################
# Cephadm deployment configuration.

# Ceph release name.
cephadm_ceph_release: "reef"

# TODO placeholders
stackhpc_docker_registry: ""
stackhpc_sync_ceph_images: false

# Ceph FSID.
#cephadm_fsid:

# Ceph container image.
cephadm_image: "{{ stackhpc_docker_registry if stackhpc_sync_ceph_images | bool else 'quay.io' }}/ceph/ceph:{{ cephadm_image_tag }}"

# Ceph container image tag.
cephadm_image_tag: "v18.2.7"

# Ceph custom repo workaround for Ubuntu Jammy as there are no official ceph repos for jammy.
cephadm_custom_repos: "{{ ansible_facts['distribution_release'] == 'jammy' }}"

# HAProxy container image.
cephadm_haproxy_image: "{{ stackhpc_docker_registry if stackhpc_sync_ceph_images | bool else 'quay.io' }}/ceph/haproxy:{{ cephadm_haproxy_image_tag }}"

# HAProxy container image tag.
cephadm_haproxy_image_tag: "2.6"

# Keepalived container image.
cephadm_keepalived_image: "{{ stackhpc_docker_registry if stackhpc_sync_ceph_images | bool else 'quay.io' }}/ceph/keepalived:{{ cephadm_keepalived_image_tag }}"

# Keepalived container image tag.
cephadm_keepalived_image_tag: "2.2.4"

# Ceph container image registry URL.
# cephadm_registry_url: "{{ stackhpc_docker_registry }}"

# Ceph container image registry username.
# cephadm_registry_username: "{{ stackhpc_docker_registry_username }}"

# Ceph container image registry password.
# cephadm_registry_password: "{{ stackhpc_docker_registry_password }}"

# Cephadm admin network interface.
cephadm_admin_interface: "{{ admin_oc_net_name | net_interface }}"

# Ceph public network interface.
cephadm_public_interface: "{{ storage_net_name | net_interface }}"

# Ceph public network subnet CIDR.
cephadm_public_network: "{{ storage_net_name | net_cidr }}"

# Ceph cluster network interface.
cephadm_cluster_interface: "{{ storage_mgmt_net_name | net_interface }}"

# Ceph cluster network subnet CIDR.
cephadm_cluster_network: "{{ storage_mgmt_net_name | net_cidr }}"

# Whether to enable firewalld for Ceph storage hosts.
#cephadm_enable_firewalld:

# List of /dev/device paths to use, e.g. for multipath devices that can't be
# used with an OSD spec.
#cephadm_osd_devices:

# Ceph OSD specification.
cephadm_osd_spec: |
  service_type: osd
  service_id: osd_spec_r760
  placement:
    hosts:
      - ceph-hdd-01
      - ceph-hdd-02
      - ceph-hdd-03
      - ceph-hdd-04
      - ceph-hdd-05
      - ceph-hdd-06
      - ceph-hdd-07
      - ceph-hdd-08
      - ceph-hdd-09
      - ceph-hdd-10
      - ceph-hdd-11
      - ceph-hdd-12
  spec:
    data_devices:
      size: '15TB:'
  ---
  service_type: osd
  service_id: osd_spec_ssd_me5
  placement:
    hosts:
      - ceph-mds-01
      - ceph-mds-02
  spec:
    data_devices:
      size: '890GB:900GB'

# Additional arguments to pass to `cephadm bootstrap`.
#cephadm_bootstrap_additional_parameters:

###############################################################################
# Ceph post-deployment configuration.

# List of Ceph erasure coding profiles. See stackhpc.cephadm.ec_profiles role
# for format.
#cephadm_ec_profiles:
cephadm_ec_profiles:
  - name: ec_4_2_hdd
    k: 4
    m: 2
    crush_device_class: hdd

# List of Ceph CRUSH rules. See stackhpc.cephadm.crush_rules role for format.
#cephadm_crush_rules:

# List of Ceph pools. See stackhpc.cephadm.pools role for format.
#cephadm_pools:
cephadm_pools:
  - name: backups-data
    application: rbd
    state: present
    pool_type: erasure
    erasure_profile: ec_4_2_hdd
    allow_ec_overwrites: true
  - name: backups
    application: rbd
    state: present
  - name: images-data
    application: rbd
    state: present
    pool_type: erasure
    erasure_profile: ec_4_2_hdd
    allow_ec_overwrites: true
  - name: images
    application: rbd
    state: present
  - name: volumes-data
    application: rbd
    state: present
    pool_type: erasure
    erasure_profile: ec_4_2_hdd
    allow_ec_overwrites: true 
  - name: volumes
    application: rbd
    state: present
  - name: cephfs_data
    application: cephfs
    state: present
    pool_type: erasure
    erasure_profile: ec_4_2_hdd
    allow_ec_overwrites: true
  - name: cephfs_metadata
    application: cephfs
    state: present
    size: 3

# List of Cephx keys. See stackhpc.cephadm.keys role for format.
#cephadm_keys:
cephadm_keys:
  - name: client.cinder
    caps:
      mon: "profile rbd"
      osd: "profile rbd pool=volumes, profile rbd-read-only pool=images, profile rbd pool=volumes-data, profile rbd-read-only pool=images-data"
      mgr: "profile rbd pool=volumes, profile rbd pool=volumes-data"
    state: present 
  - name: client.cinder-backup
    caps:
      mon: "profile rbd"
      osd: "profile rbd pool=volumes, profile rbd pool=backups, profile rbd pool=volumes-data, profile rbd pool=backups-data"
      mgr: "profile rbd pool=volumes, profile rbd pool=backups, profile rbd pool=volumes-data, profile rbd pool=backups-data"
    state: present
  - name: client.glance
    caps:
      mon: "profile rbd"
      osd: "profile rbd pool=images, profile rbd pool=images-data"
      mgr: "profile rbd pool=images, profile rbd pool=images-data"
    state: present
  - name: client.manila
    caps:
      mon: "allow r"
      mgr: "allow rw"
    state: present

# A list of commands to pass to cephadm shell -- ceph. See
# stackhpc.cephadm.commands for format. Pre commands run before the rest of the
# post-deployment configuration, post commands run after the rest of the
# post-deployment configuration.
cephadm_commands_pre: "{{ cephadm_commands_pre_default + cephadm_commands_pre_extra }}"
cephadm_commands_post: "{{ cephadm_commands_post_default + cephadm_commands_post_extra }}"

cephadm_commands_pre_default: []
cephadm_commands_pre_extra:
 - "config set global ms_cluster_mode secure"
 - "config set global ms_service_mode secure"
 - "config set global ms_client_mode secure"
cephadm_commands_post_default: "{{ ['mgr module enable prometheus'] if kolla_enable_prometheus_ceph_mgr_exporter | default(False) | bool else [] }}"
cephadm_commands_post_extra:
  - "fs new manila-cephfs cephfs_metadata cephfs_data --force"
  - "orch apply mds manila-cephfs"
###############################################################################
# Kolla Ceph auto-configuration.

# List of Kolla Ansible services that require Ceph configuration files.
kolla_ceph_services:
  - name: cinder-backup
    keys:
      - client.cinder
      - client.cinder-backup
    required: "{{ kolla_ceph_cinder_backup_required | bool }}"
  - name: cinder-volume
    keys:
      - client.cinder
    required: "{{ kolla_ceph_cinder_volume_required | bool }}"
  - name: glance
    keys:
      - client.glance
    required: "{{ kolla_ceph_glance_required | bool }}"
  - name: manila
    keys:
      - client.manila
    required: "{{ kolla_ceph_manila_required | bool }}"
  - name: nova
    keys:
      - client.cinder
    required: "{{ kolla_ceph_nova_required | bool }}"

# Whether to generate Ceph configuration for Cinder volume.
kolla_ceph_cinder_volume_required: "{{ kolla_enable_cinder | bool }}"

# Whether to generate Ceph configuration for Cinder backup.
kolla_ceph_cinder_backup_required: "{{ kolla_enable_cinder_backup | default(true) | bool }}"

# Whether to generate Ceph configuration for Glance.
kolla_ceph_glance_required: "{{ kolla_enable_glance | bool }}"

# Whether to generate Ceph configuration for Manila.
kolla_ceph_manila_required: "{{ kolla_enable_manila | bool }}"

# Whether to generate Ceph configuration for Nova.
kolla_ceph_nova_required: "{{ kolla_enable_nova | bool }}"
