[federation]
trusted_dashboard = https://portal.azimuth.man.uksrc.org/auth/federated/complete/
trusted_dashboard = https://api.openstack.man.uksrc.org/auth/websso/

[security_compliance]
change_password_after_first_use = True
password_regex = ^(?=.*\d)(?=.*[a-zA-Z]).{16,}$
password_regex_description = Passwords must contain at least 1 letter, 1 digit, and be a minimum length of 16 characters.
lockout_failure_attempts = 3
lockout_duration = 1800
disable_user_account_days_inactive = 90